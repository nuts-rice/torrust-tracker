[package]
description = "Runs the Torrust Tracker git hook check suites and installs the repository git hooks."
name = "torrust-git-hooks"
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[[bin]]
name = "torrust-git-hooks"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = [ "derive" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
